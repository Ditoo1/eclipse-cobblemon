[package]
name = "eclipse_core"
version = "0.1.0"
edition = "2021"
description = "Núcleo multiplataforma de EclipseCobblemon (Android vía JNI, Apple vía C ABI)"

[lib]
# cdylib -> libeclipse_core.so (Android) / .dylib (macOS)
# staticlib -> libeclipse_core.a (iOS / XCFramework)
# rlib -> tests y uso desde otros crates
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
md-5 = "0.10"
sha1 = "0.10"

[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.21", default-features = false }

[profile.release]
lto = true
strip = true
opt-level = "s"
