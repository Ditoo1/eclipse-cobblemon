org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
kotlin.code.style=official

android.useAndroidX=true
android.enableJetifier=true

# Necesarias para el código vendorizado de Amethyst (:amethyst), igual que en su repo:
# usa R transitivo (recursos de sdp/ssp, etc.) y R.id en switch.
android.nonTransitiveRClass=false
android.nonFinalResIds=false
android.defaults.buildfeatures.resvalues=true
android.bundle.language.enableSplit=false
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false

# URL del manifiesto del pack publicado por el Worker (ver cloudflare/README.md), p. ej.
# packUrl=https://eclipse-pack.<tu-subdominio>.workers.dev/v1/manifest
# Vacía: la app lanza Minecraft vanilla sin sincronizar nada.
packUrl=https://eclipse-pack.blandt.workers.dev/v1/manifest
