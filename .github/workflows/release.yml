name: Release build

# Compila el IPA en modo Release y crea un borrador de release en GitHub con los ficheiros.
# Se lanza al subir una etiqueta vX.Y.Z (o a mano desde Actions).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión (p. ej. 1.0.0)'
        required: true
        default: '1.0.0'

permissions:
  contents: write

jobs:
  android:
    uses: ./.github/workflows/android.yml
    secrets: inherit
    with:
      version: ${{ github.event.inputs.version || github.ref_name }}

  release:
    needs: android
    name: Release IPA (iOS)
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '8'

      - name: Install build tools
        run: |
          brew install ldid make wget
          xcodebuild -version

      - name: Version
        id: ver
        run: |
          V="${{ github.event.inputs.version }}"
          if [ -z "$V" ]; then V="${GITHUB_REF_NAME#v}"; fi
          echo "version=$V" >> $GITHUB_OUTPUT
          plutil -replace CFBundleShortVersionString -string "$V" Natives/Info.plist
          plutil -replace CFBundleVersion -string "${{ github.run_number }}" Natives/Info.plist

      - name: Build (Release)
        run: |
          export PATH=/opt/homebrew/opt/make/libexec/gnubin:$PATH
          V=${{ steps.ver.outputs.version }}
          gmake -j$(sysctl -n hw.ncpu) dsym package PLATFORM=2 RELEASE=1 VERSION=$V BOOTJDK="$JAVA_HOME/bin"
          gmake -j$(sysctl -n hw.ncpu) package PLATFORM=2 RELEASE=1 VERSION=$V TROLLSTORE_JIT_ENT=1 BOOTJDK="$JAVA_HOME/bin"
          cd artifacts && zip -qr EclipseCobblemon-$V.dSYM.zip AngelAuraAmethyst.dSYM
          ls -la

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EclipseCobblemon-${{ steps.ver.outputs.version }}-release
          path: |
            artifacts/*.ipa
            artifacts/*.tipa
            artifacts/*.dSYM.zip

      - name: APK de Android
        uses: actions/download-artifact@v5
        with:
          name: EclipseCobblemon-android
          path: android-apk

      - name: Draft GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Eclipse Cobblemon ${{ steps.ver.outputs.version }}
          draft: true
          body: |
            Eclipse Cobblemon ${{ steps.ver.outputs.version }} para iPhone e Android (Minecraft 1.21.1).

            - `EclipseCobblemon-${{ steps.ver.outputs.version }}-ios.ipa`: SideStore / AltStore.
            - `EclipseCobblemon-${{ steps.ver.outputs.version }}-ios-trollstore.tipa`: TrollStore.
            - `EclipseCobblemon-${{ steps.ver.outputs.version }}-android.apk`: Android 8.0 ou superior.

            Requisitos: iOS 14+, JIT ativo. Recomendado: iPhone 12 Pro, 13 Pro, 14 ou superior · Mínimo: iPhone XS.
            Baseado no Amethyst-iOS e no Amethyst-Android (LGPL-3.0).
          files: |
            android-apk/release/EclipseCobblemon-*-android.apk
            artifacts/*.ipa
            artifacts/*.tipa
            artifacts/*.dSYM.zip
