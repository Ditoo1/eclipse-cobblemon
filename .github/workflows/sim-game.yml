name: Simulator game test

# Compila la app para el simulador CON Java, la instala, inicia sesión offline,
# pulsa Jogar sola y guarda capturas y registos mientras arranca el Minecraft.
on:
  push:
    paths:
      - '.github/workflows/sim-game.yml'
  workflow_dispatch:

concurrency:
  group: sim-game-${{ github.ref }}
  cancel-in-progress: true

jobs:
  game:
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '8'

      - name: Install build tools
        run: brew install ldid make wget

      - name: Build for iOS Simulator (with Java)
        run: |
          export PATH=/opt/homebrew/opt/make/libexec/gnubin:$PATH
          gmake -j$(sysctl -n hw.ncpu) payload PLATFORM=7 BOOTJDK="$JAVA_HOME/bin"
          APPDIR=artifacts/Payload/AngelAuraAmethyst.app
          ls "$APPDIR/java_runtimes"
          PL="$APPDIR/Info.plist"
          SDKVER=$(xcrun --sdk iphonesimulator --show-sdk-version)
          plutil -remove CFBundleSupportedPlatforms "$PL" 2>/dev/null || true
          plutil -insert CFBundleSupportedPlatforms -json '["iPhoneSimulator"]' "$PL"
          plutil -replace DTPlatformName -string iphonesimulator "$PL"
          plutil -replace DTSDKName -string "iphonesimulator$SDKVER" "$PL"
          plutil -replace DTPlatformVersion -string "$SDKVER" "$PL"
          plutil -replace UIDeviceFamily -json '[1,2]' "$PL"
          # JNA: Minecraft extrae la librería de Mac sin firma válida y el simulador la mata.
          # Se incluye ya convertida al simulador y firmada; la app apunta JNA a esta carpeta.
          mkdir -p "$APPDIR/jna" /tmp/jna
          curl -sSLo /tmp/jna/jna.jar https://repo1.maven.org/maven2/net/java/dev/jna/jna/5.13.0/jna-5.13.0.jar
          (cd /tmp/jna && unzip -oq jna.jar 'com/sun/jna/darwin-aarch64/*')
          cp /tmp/jna/com/sun/jna/darwin-aarch64/libjnidispatch.jnilib "$APPDIR/jna/libjnidispatch.jnilib"
          lipo -thin arm64 "$APPDIR/jna/libjnidispatch.jnilib" -output "$APPDIR/jna/libjnidispatch.jnilib" 2>/dev/null || true
          codesign --remove-signature "$APPDIR/jna/libjnidispatch.jnilib" || true
          vtool -arch arm64 -set-build-version 7 14.0 16.0 -replace -output "$APPDIR/jna/libjnidispatch.jnilib" "$APPDIR/jna/libjnidispatch.jnilib"
          vtool -show-build "$APPDIR/jna/libjnidispatch.jnilib"
          # Firma ad hoc de todos los Mach-O (incluido Java), de dentro hacia fuera
          find "$APPDIR" -type f | while read -r f; do
            if file "$f" | grep -q "Mach-O"; then codesign --force --sign - --timestamp=none "$f" 2>/dev/null || echo "no firmado: $f"; fi
          done
          find "$APPDIR" -name '*.framework' -maxdepth 2 -print0 | xargs -0 -I{} codesign --force --sign - --timestamp=none {} || true
          codesign --force --sign - --timestamp=none "$APPDIR"
          vtool -show-build "$APPDIR/java_runtimes/java-21-openjdk/lib/server/libjvm.dylib" | head -12 || true
          mkdir -p simapp
          ditto -c -k --sequesterRsrc --keepParent "$APPDIR" simapp/EclipseCobblemon-simulator-full.zip
          ls -la simapp

      - name: Upload simulator app (with Java)
        uses: actions/upload-artifact@v4
        with:
          name: EclipseCobblemon-simulator-full
          path: simapp/
          compression-level: 0

      - name: Boot simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          c=[x for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone') and 'Pro' in x['name'] and 'Max' not in x['name']]
          c=c or [x for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')]
          print(c[-1]['udid'])")
          echo "udid=$UDID" >> $GITHUB_OUTPUT
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" artifacts/Payload/AngelAuraAmethyst.app

      - name: Play
        run: |
          UDID=${{ steps.sim.outputs.udid }}
          APP=dev.eclipsecobblemon.ios
          mkdir -p out
          # Igual que StikDebug en el iPhone: con un depurador conectado iOS permite el código JIT.
          OUT=$(SIMCTL_CHILD_EC_PREVIEW_USER=DitoBlan SIMCTL_CHILD_EC_AUTOPLAY=1 \
            xcrun simctl launch -w --stdout="$PWD/out/stdout.txt" --stderr="$PWD/out/stderr.txt" "$UDID" "$APP")
          echo "$OUT"
          PID=$(echo "$OUT" | awk '{print $NF}')
          sudo DevToolsSecurity -enable || true
          ps -o pid,stat,comm -p "$PID" || true
          { printf '%s\n' \
              'settings set platform.plugin.darwin.ignored-exceptions EXC_BAD_ACCESS|EXC_BAD_INSTRUCTION|EXC_ARITHMETIC' \
              "process attach -p $PID" \
              'process handle -p true -s false -n false SIGSEGV SIGBUS SIGILL SIGUSR1 SIGUSR2 SIGPIPE SIGALRM SIGXCPU' \
              'continue'; sleep 3000; } | sudo lldb > out/lldb.txt 2>&1 &
          sleep 15
          head -40 out/lldb.txt || true
          # Capturas cada 10 s durante ~25 minutos (descarga + arranque del juego)
          for i in $(seq -w 1 150); do
            sleep 10
            xcrun simctl io "$UDID" screenshot "out/shot-$i.png" >/dev/null 2>&1 || true
            if ! xcrun simctl spawn "$UDID" launchctl list 2>/dev/null | grep -q "UIKitApplication:$APP"; then
              echo "La app se ha cerrado en la captura $i ($(date +%T))"
              xcrun simctl spawn "$UDID" launchctl list 2>/dev/null | grep -i "eclipse\|UIKitApplication" || true
              break
            fi
          done
          tail -60 out/stderr.txt || true
          tail -60 out/lldb.txt || true

      - name: Collect logs
        if: always()
        run: |
          UDID=${{ steps.sim.outputs.udid }}
          APP=dev.eclipsecobblemon.ios
          DATA=$(xcrun simctl get_app_container "$UDID" "$APP" data 2>/dev/null || true)
          echo "data: $DATA"
          if [ -n "$DATA" ]; then
            find "$DATA" -maxdepth 3 -name '*.txt' -o -maxdepth 3 -name '*.log' | while read -r f; do cp "$f" "out/$(basename "$f")" 2>/dev/null || true; done
            find "$DATA" -maxdepth 4 | head -200 > out/container-tree.txt
            cp -R "$DATA/Documents/instances" out/instances 2>/dev/null || true
            rm -rf out/instances/*/assets out/instances/*/libraries out/instances/*/versions 2>/dev/null || true
          fi
          sleep 20
          mkdir -p out/crash
          find ~/Library/Logs/DiagnosticReports /Library/Logs/DiagnosticReports -mmin -60 -type f 2>/dev/null | while read -r f; do cp "$f" out/crash/ 2>/dev/null || true; done
          # Motivo de terminación según el sistema (runningboard / SpringBoard)
          xcrun simctl spawn "$UDID" log show --last 40m --style compact --predicate 'eventMessage CONTAINS[c] "eclipsecobblemon" OR eventMessage CONTAINS[c] "AngelAuraAmethyst"' 2>/dev/null | grep -i "termin\|exit\|crash\|kill\|death\|signal\|jetsam" | tail -40 | tee out/termination.txt || true
          ls -la out/crash
          for f in out/crash/*; do [ -f "$f" ] && head -c 6000 "$f"; done || true
          xcrun simctl spawn "$UDID" log show --last 40m --predicate 'process == "AngelAuraAmethyst"' --style compact 2>/dev/null | grep -v "CFNetwork\|com.apple.network\|caulk" | tail -3000 > out/oslog.txt || true
          tail -60 out/oslog.txt
          tail -80 out/latestlog.txt 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sim-game-result
          path: out/
