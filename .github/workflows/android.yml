name: Android build

# Compila el APK de Android (android/) en paralelo con el IPA de iOS.
# Con los secretos de firma configurados, también genera el APK release firmado.
on:
  push:
    branches-ignore:
      - 'l10n_main'
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
  workflow_dispatch:
  # release.yml lo llama para adjuntar el APK firmado a la release
  workflow_call:
    inputs:
      version:
        description: 'versionName del APK'
        type: string
        required: false

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK (Android)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: android
    env:
      NDK_VERSION: 27.3.13750724
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # El runner de Ubuntu ya trae el SDK de Android; solo faltan la plataforma 37 y el NDK
      - name: Instalar SDK 37 y NDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-37.0" "ndk;${NDK_VERSION}"

      - uses: gradle/actions/setup-gradle@v5

      - name: Núcleo Rust (libeclipse_core.so)
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          cargo install cargo-ndk --locked
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION"
          cd native
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -P 26 -o ../app/src/main/jniLibs build --release

      - name: Tests
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest
          (cd native && cargo test)

      - name: APK debug
        run: ./gradlew assembleDebug

      - name: Preparar firma
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "Sin secretos de firma: solo APK debug"; exit 0; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          cat > "$RUNNER_TEMP/keystore.properties" <<EOF
          storeFile=$RUNNER_TEMP/release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: APK release firmado
        if: steps.signing.outputs.enabled == 'true'
        env:
          ECLIPSE_SIGNING_PROPS: ${{ runner.temp }}/keystore.properties
          VERSION: ${{ inputs.version }}
        run: |
          VERSION="${VERSION#v}"
          if [ -n "$VERSION" ]; then
            ./gradlew assembleRelease -PversionName="$VERSION" -PversionCode=${{ github.run_number }}
            cp app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/EclipseCobblemon-$VERSION-android.apk"
          else
            ./gradlew assembleRelease
          fi

      - name: Una release necesita el APK firmado
        if: inputs.version != '' && steps.signing.outputs.enabled != 'true'
        run: |
          echo "Faltan los secretos ANDROID_* de firma" >&2
          exit 1

      - uses: actions/upload-artifact@v5
        with:
          name: EclipseCobblemon-android
          path: android/app/build/outputs/apk/**/*.apk
