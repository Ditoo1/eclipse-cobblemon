name: Development build

on:
  push:
    branches-ignore:
      - 'l10n_main'
    # android/ se compila en android.yml
    paths-ignore:
      - 'android/**'
      - '.github/workflows/android.yml'
  pull_request:
    types: [opened, reopened, synchronize]
    paths-ignore:
      - 'android/**'
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build IPA (iOS)
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 20

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '8'

      - name: Install build tools
        run: |
          brew install ldid make wget
          cmake --version
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || xcode-select -p)" || true
          xcodebuild -version

      - name: Build
        run: |
          export PATH=/opt/homebrew/opt/make/libexec/gnubin:$PATH
          gmake -j$(sysctl -n hw.ncpu) dsym package PLATFORM=2 BOOTJDK="$JAVA_HOME/bin"
          gmake -j$(sysctl -n hw.ncpu) package PLATFORM=2 TROLLSTORE_JIT_ENT=1 BOOTJDK="$JAVA_HOME/bin"
          ls -la artifacts

      - name: Upload ipa
        uses: actions/upload-artifact@v4
        with:
          name: EclipseCobblemon-ipa
          path: artifacts/*.ipa
          if-no-files-found: error

      - name: Upload tipa (TrollStore)
        uses: actions/upload-artifact@v4
        with:
          name: EclipseCobblemon-trollstore-tipa
          path: artifacts/*.tipa

      - name: Upload dSYM
        uses: actions/upload-artifact@v4
        with:
          name: EclipseCobblemon.dSYM
          path: artifacts/*.dSYM
